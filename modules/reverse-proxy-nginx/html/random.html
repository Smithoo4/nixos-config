<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{HOSTNAME}}</title>
    <!-- Inline SVG favicon — dynamically set via JS -->
    <link id="favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='black'/><text x='50' y='60' font-size='60' text-anchor='middle' fill='%2300ff41' font-family='monospace'>S</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; height: 100vh; }

        /* Terminal theme */
        body[data-theme="terminal"] {
            background: #050505;
            color: #00ff41;
            font-family: "Courier New", Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        body[data-theme="terminal"]::before {
            content: " ";
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,.25) 50%),
                        linear-gradient(90deg, rgba(255,0,0,.06), rgba(0,255,0,.02), rgba(0,0,255,.06));
            background-size: 100% 2px, 3px 100%;
            z-index: 2;
            pointer-events: none;
        }
        .terminal-container {
            text-align: center;
            border: 2px solid #00ff41;
            padding: 4rem;
            box-shadow: 0 0 20px #00ff41, inset 0 0 20px #00ff41;
            position: relative;
            z-index: 1;
        }
        .terminal-container h1 {
            font-size: 3.5rem;
            text-transform: uppercase;
            letter-spacing: 10px;
            text-shadow: 0 0 10px #00ff41;
        }
        .terminal-container p {
            margin-top: 2rem;
            font-size: 1.2rem;
            letter-spacing: 2px;
            opacity: 0.8;
        }
        .flicker { animation: pulse 2s infinite; }
        @keyframes pulse { 0%{opacity:1} 50%{opacity:.4} 100%{opacity:1} }

        /* Matrix theme */
        body[data-theme="matrix"] { background: #000; }
        body[data-theme="matrix"] canvas { display: block; }
        .matrix-overlay {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }
        .matrix-overlay h1 {
            font-family: "Courier New", monospace;
            font-size: 4rem;
            color: #00ff41;
            text-shadow: 0 0 20px #00ff41, 0 0 40px #00ff41;
            text-transform: uppercase;
            letter-spacing: 10px;
        }
        .matrix-overlay p {
            font-family: "Courier New", monospace;
            color: #00ff41;
            font-size: 1.2rem;
            margin-top: 1rem;
            opacity: 0.7;
            letter-spacing: 3px;
        }

        /* Blueprint theme */
        body[data-theme="blueprint"] {
            background-color: #0a1628;
            background-image:
                linear-gradient(rgba(65,135,235,0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(65,135,235,0.15) 1px, transparent 1px),
                linear-gradient(rgba(65,135,235,0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(65,135,235,0.08) 1px, transparent 1px);
            background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px;
            color: #4187eb;
            font-family: "Courier New", monospace;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .blueprint-frame {
            border: 1px solid rgba(65,135,235,0.4);
            padding: 5rem 6rem;
            position: relative;
            text-align: center;
        }
        .blueprint-frame::before { content: "+"; position: absolute; top: -2px; left: 6px; color: rgba(65,135,235,0.4); font-size: 1.2rem; }
        .blueprint-frame::after  { content: "+"; position: absolute; top: -2px; right: 6px; color: rgba(65,135,235,0.4); font-size: 1.2rem; }
        .blueprint-inner::before { content: "+"; position: absolute; bottom: -2px; left: 6px; color: rgba(65,135,235,0.4); font-size: 1.2rem; }
        .blueprint-inner::after  { content: "+"; position: absolute; bottom: -2px; right: 6px; color: rgba(65,135,235,0.4); font-size: 1.2rem; }
        .blueprint-label {
            font-size: 0.7rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: rgba(65,135,235,0.4);
            margin-bottom: 1rem;
        }
        .blueprint-frame h1 {
            font-size: 3.5rem;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 12px;
        }
        .blueprint-status {
            margin-top: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            font-size: 0.9rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(65,135,235,0.4);
        }
        .blueprint-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #4187eb;
            animation: bp-blink 2s infinite;
        }
        @keyframes bp-blink { 0%,100%{opacity:1} 50%{opacity:.3} }
        .blueprint-dwg {
            position: absolute;
            bottom: 10px; right: 15px;
            font-size: 0.6rem;
            color: rgba(65,135,235,0.4);
            letter-spacing: 2px;
        }

        /* Stranger Things theme */
        body[data-theme="strangerthings"] {
            background: #0a0000;
            color: #ff1a1a;
            font-family: Georgia, "Times New Roman", serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .st-container {
            text-align: center;
            position: relative;
            z-index: 5;
        }
        .st-container h1 {
            font-size: 5rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 18px;
            color: #d40000;
            text-shadow:
                0 0 10px #ff0000,
                0 0 20px #ff0000,
                0 0 40px #cc0000,
                0 0 80px #990000,
                0 0 120px #660000;
            animation: st-glow 3s ease-in-out infinite;
            line-height: 1.1;
        }
        .st-container h1 span.st-first {
            display: inline-block;
            vertical-align: top;
            font-size: 6rem;
            line-height: 0.85;
        }
        .st-container h1 span.st-last {
            display: inline-block;
            vertical-align: bottom;
            font-size: 6rem;
            line-height: 0.85;
        }
        @keyframes st-glow {
            0%, 100% { opacity: 1; text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000, 0 0 40px #cc0000, 0 0 80px #990000; }
            50% { opacity: 0.85; text-shadow: 0 0 5px #ff0000, 0 0 10px #ff0000, 0 0 20px #cc0000, 0 0 40px #990000; }
        }
        .st-subtitle {
            margin-top: 2.5rem;
            font-size: 1rem;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: #ff3333;
            opacity: 0.6;
            font-family: Georgia, "Times New Roman", serif;
        }
        .st-line {
            width: 300px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #ff0000, transparent);
            margin: 1.5rem auto;
            opacity: 0.4;
        }

        /* Christmas lights */
        .st-lights {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }
        .st-bulb {
            position: absolute;
            width: 8px;
            height: 12px;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            opacity: 0;
            animation: st-bulb-flicker var(--duration) var(--delay) infinite;
        }
        @keyframes st-bulb-flicker {
            0%, 20%, 100% { opacity: 0; }
            5%, 15% { opacity: 1; }
            10% { opacity: 0.3; }
        }

        /* Floating ash / particles */
        .st-particles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 2;
            overflow: hidden;
        }
        .st-ash {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(200, 100, 80, 0.4);
            border-radius: 50%;
            animation: st-float linear infinite;
        }
        @keyframes st-float {
            0% { transform: translateY(100vh) translateX(0) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) translateX(var(--drift)) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <!-- Terminal theme -->
    <div id="theme-terminal" style="display:none">
        <div class="terminal-container">
            <h1>{{HOSTNAME}}</h1>
            <p class="flicker">System is online and secure</p>
        </div>
    </div>

    <!-- Matrix theme -->
    <div id="theme-matrix" style="display:none">
        <canvas id="rain"></canvas>
        <div class="matrix-overlay">
            <h1>{{HOSTNAME}}</h1>
            <p>System is online and secure</p>
        </div>
    </div>

    <!-- Blueprint theme -->
    <div id="theme-blueprint" style="display:none">
        <div class="blueprint-frame">
            <div class="blueprint-inner"></div>
            <div class="blueprint-label">System Designation</div>
            <h1>{{HOSTNAME}}</h1>
            <div class="blueprint-status">
                <div class="blueprint-dot"></div>
                System is online and secure
            </div>
            <div class="blueprint-dwg">DWG NO. {{HOSTNAME}}-001 REV. A</div>
        </div>
    </div>

    <!-- Stranger Things theme -->
    <div id="theme-strangerthings" style="display:none">
        <div class="st-lights" id="st-lights"></div>
        <div class="st-particles" id="st-particles"></div>
        <div class="st-container">
            <h1 id="st-title"></h1>
            <div class="st-line"></div>
            <p class="st-subtitle">System is online and secure</p>
        </div>
    </div>

    <script>
        const themes = ["terminal", "matrix", "blueprint", "strangerthings"];
        const pick = themes[Math.floor(Math.random() * themes.length)];
        const hostname = "{{HOSTNAME}}";

        document.body.setAttribute("data-theme", pick);
        document.getElementById("theme-" + pick).style.display = "";

        // Dynamic favicon — first letter of hostname, theme-matched color
        (function setFavicon() {
            const letter = hostname.charAt(0).toUpperCase();
            const colors = {
                terminal: { bg: "black", fg: "%2300ff41" },
                matrix: { bg: "black", fg: "%2300ff41" },
                blueprint: { bg: "%230a1628", fg: "%234187eb" },
                strangerthings: { bg: "%230a0000", fg: "%23ff0000" }
            };
            const c = colors[pick] || colors.terminal;
            const svg = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>" +
                "<rect width='100' height='100' fill='" + c.bg + "'/>" +
                "<text x='50' y='68' font-size='60' text-anchor='middle' fill='" + c.fg + "' font-family='monospace'>" + letter + "</text></svg>";
            document.getElementById("favicon").href = "data:image/svg+xml," + svg;
        })();

        // Matrix canvas animation
        if (pick === "matrix") {
            const canvas = document.getElementById("rain");
            const ctx = canvas.getContext("2d");
            const chars = "アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789";
            let w, h, cols, drops;
            function init() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
                cols = Math.floor(w / 20);
                drops = Array(cols).fill(1);
            }
            function draw() {
                ctx.fillStyle = "rgba(0,0,0,0.05)";
                ctx.fillRect(0, 0, w, h);
                ctx.fillStyle = "#00ff41";
                ctx.font = "16px monospace";
                for (let i = 0; i < drops.length; i++) {
                    const t = chars[Math.floor(Math.random() * chars.length)];
                    ctx.fillText(t, i * 20, drops[i] * 20);
                    if (drops[i] * 20 > h && Math.random() > 0.975) drops[i] = 0;
                    drops[i]++;
                }
            }
            init();
            window.addEventListener("resize", init);
            setInterval(draw, 50);
        }

        // Stranger Things — title with oversized first & last letters
        if (pick === "strangerthings") {
            const titleEl = document.getElementById("st-title");
            const name = hostname.toUpperCase();
            if (name.length <= 2) {
                titleEl.textContent = name;
            } else {
                const first = '<span class="st-first">' + name[0] + '</span>';
                const mid = name.slice(1, -1);
                const last = '<span class="st-last">' + name[name.length - 1] + '</span>';
                titleEl.innerHTML = first + mid + last;
            }

            // Generate Christmas lights
            const lightsContainer = document.getElementById("st-lights");
            const bulbColors = ["#ff0000", "#ffcc00", "#00cc00", "#0066ff", "#ff6600", "#cc00ff", "#00ccff"];
            for (let i = 0; i < 60; i++) {
                const bulb = document.createElement("div");
                bulb.className = "st-bulb";
                bulb.style.left = Math.random() * 100 + "%";
                bulb.style.top = Math.random() * 100 + "%";
                bulb.style.background = bulbColors[Math.floor(Math.random() * bulbColors.length)];
                bulb.style.boxShadow = "0 0 6px " + bulb.style.background + ", 0 0 12px " + bulb.style.background;
                bulb.style.setProperty("--duration", (2 + Math.random() * 4) + "s");
                bulb.style.setProperty("--delay", (Math.random() * 5) + "s");
                lightsContainer.appendChild(bulb);
            }

            // Generate floating ash particles
            const particlesContainer = document.getElementById("st-particles");
            for (let i = 0; i < 40; i++) {
                const ash = document.createElement("div");
                ash.className = "st-ash";
                ash.style.left = Math.random() * 100 + "%";
                ash.style.width = (1 + Math.random() * 3) + "px";
                ash.style.height = ash.style.width;
                ash.style.animationDuration = (8 + Math.random() * 12) + "s";
                ash.style.animationDelay = (Math.random() * 10) + "s";
                ash.style.setProperty("--drift", (Math.random() * 100 - 50) + "px");
                particlesContainer.appendChild(ash);
            }
        }
    </script>
</body>
</html>
