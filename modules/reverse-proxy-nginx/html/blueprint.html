<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{HOSTNAME}}</title>
    <style>
        :root {
            --bg: #0a1628;
            --line: rgba(65, 135, 235, 0.08);
            --line-major: rgba(65, 135, 235, 0.15);
            --text: #4187eb;
            --text-dim: rgba(65, 135, 235, 0.4);
        }
        body {
            margin: 0;
            background-color: var(--bg);
            background-image:
                linear-gradient(var(--line-major) 1px, transparent 1px),
                linear-gradient(90deg, var(--line-major) 1px, transparent 1px),
                linear-gradient(var(--line) 1px, transparent 1px),
                linear-gradient(90deg, var(--line) 1px, transparent 1px);
            background-size:
                100px 100px,
                100px 100px,
                20px 20px,
                20px 20px;
            color: var(--text);
            font-family: "Courier New", monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .frame {
            border: 1px solid var(--text-dim);
            padding: 5rem 6rem;
            position: relative;
            text-align: center;
        }
        .frame::before, .frame::after,
        .inner::before, .inner::after {
            position: absolute;
            color: var(--text-dim);
            font-size: 1.2rem;
            line-height: 1;
        }
        .frame::before { content: "+"; top: -2px; left: 6px; }
        .frame::after  { content: "+"; top: -2px; right: 6px; }
        .inner::before { content: "+"; bottom: -2px; left: 6px; position: absolute; }
        .inner::after  { content: "+"; bottom: -2px; right: 6px; position: absolute; }
        .label {
            font-size: 0.7rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 1rem;
        }
        h1 {
            font-size: 3.5rem;
            font-weight: 300;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 12px;
        }
        .status {
            margin-top: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            font-size: 0.9rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-dim);
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text);
            animation: blink 2s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .drawing-no {
            position: absolute;
            bottom: 10px;
            right: 15px;
            font-size: 0.6rem;
            color: var(--text-dim);
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="frame">
        <div class="inner"></div>
        <div class="label">System Designation</div>
        <h1>{{HOSTNAME}}</h1>
        <div class="status">
            <div class="dot"></div>
            System is online and secure
        </div>
        <div class="drawing-no">DWG NO. {{HOSTNAME}}-001 REV. A</div>
    </div>
</body>
</html>
